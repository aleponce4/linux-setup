name: genome
channels:
  - conda-forge
  - bioconda
dependencies:
  - bcftools>=1.24
  - htslib>=1.24
  - samtools>=1.24
  - echtvar>=0.2.3
  - annotsv>=3.5.10     # structural-variant annotation; annotations live in /data/datasets/refdata/GRCh38/annotsv-3.5
  - somalier>=0.3.5      # ancestry, sex and relatedness checks across the family
  - haplogrep3>=3.2.2    # mitochondrial haplogroups
  - openjdk>=17          # runtime for haplogrep3
