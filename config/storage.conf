# Non-secret storage facts for strix. Keep this file in git and update it after an intentional
# reinstall or disk replacement. Persistent mounts use filesystem UUIDs; whole-disk identity checks
# use stable /dev/disk/by-id paths plus serials. SATA /dev/sdX ordering is never trusted.

# Current stock Kubuntu 26.04 installation.
ROOT_DEVICE="/dev/nvme0n1p2"
ROOT_FS="ext4"
ROOT_UUID="1e0539dd-c9b4-4222-9076-48a11c6154d9"

# Physical disks. ROOT_DEVICE is allowed to use the known NVMe path; the other disks are identified
# only by stable by-id links and serials.
ROOT_DISK_ID="/dev/disk/by-id/nvme-Samsung_SSD_990_PRO_with_Heatsink_1TB_0025_3848_4140_33A2"
ROOT_DISK_SERIAL="0025_3848_4140_33A2"
DATA_DISK_ID="/dev/disk/by-id/ata-Samsung_SSD_860_EVO_500GB_S3Z1NY0M404409Z"
DATA_DISK_SERIAL="S3Z1NY0M404409Z"
BACKUP_DISK_ID="/dev/disk/by-id/ata-HGST_HUH728080ALE604_VLJAA2TY"
BACKUP_DISK_SERIAL="VLJAA2TY"
