# Stop a failed kglobalaccel from hammering the session.
#
# On 2026-09-09 this unit restarted 216 times in one boot. On Plasma 6 Wayland KWin owns the
# org.kde.kglobalaccel D-Bus name, so when a SECOND (X11) Plasma session starts alongside the
# Wayland one -- as Chrome Remote Desktop's session script did -- the standalone kglobalacceld
# can never acquire that name. It hangs, hits the 5s start timeout, restarts, forever. Both
# sessions share one user systemd instance, so they fight over a single unit.
#
# The loop is what turned a harmless conflict into a dead desktop: plasmashell, both desktop
# portals and every autostart app failed underneath it, and the machine was rebooted twice.
#
# Ceiling it converts that into one clearly failed unit that `systemctl --user --failed` shows
# and `bootstrap.sh 90` checks for -- diagnosable instead of destructive.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
