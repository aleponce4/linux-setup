# Credentials and TLS material for krdpserver.
#
# The stock unit runs `krdpserver` with no arguments, which exits 255 with
# "No users configured for login. Either pass a username/password or configure
# users using kcm_krdp." -- so KRDP never listens and the GUI way in is gone.
#
# Only the *paths* to the secrets appear here; the secrets themselves stay in
# ~/.config/krdp (0700), which is why this file is safe to keep in the repo.
# ${VAR} is the non-word-splitting form, so a password with shell-special
# characters stays a single argument.
[Service]
EnvironmentFile=%h/.config/krdp/credentials
ExecStart=
ExecStart=/usr/bin/krdpserver --username ${KRDP_USER} --password ${KRDP_PASSWORD} --certificate %h/.config/krdp/server.crt --certificate-key %h/.config/krdp/server.key
