<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strix Cheat Sheet</title>
<style>
  :root {
    --bg: #14181f; --panel: #1b2029; --card: #1f2632; --line: #2b3441;
    --ink: #e6ebf2; --muted: #8d9bb0; --key: #f4f7fb;
    --ready: #2cb8ae; --first-run: #f0a84a; --optional: #a086dd; --safety: #ef7a6b;
    font-family: "Inter", "Noto Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); height: 100%; }
  body { display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45; }
  header.top {
    display: flex; align-items: center; gap: 14px; padding: 14px 22px 0;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
  }
  header.top h1 { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin: 0 6px 12px 0; color: var(--muted); font-weight: 600; }
  nav { display: flex; gap: 2px; margin-bottom: -1px; }
  .tab {
    all: unset; cursor: pointer; padding: 8px 14px 11px; color: var(--muted); font-weight: 500;
    border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--ready); }
  .search { margin-left: auto; margin-bottom: 12px; }
  .search input {
    width: 240px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: inherit; outline: none;
  }
  .search input:focus { border-color: var(--ready); }
  main { padding: 18px 22px 26px; flex: 1; }
  .panel { display: none; }
  .panel.active, body.filtering .panel { display: block; }
  body.filtering .panel:not(.has-hits) { display: none; }
  .subtitle { margin: 0 0 14px; color: var(--muted); font-style: italic; }
  body.filtering .subtitle { display: none; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .columns { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px;
    margin-bottom: 16px; border-left: 4px solid var(--accent, var(--line));
  }
  .card.ready { --accent: var(--ready); } .card.first-run { --accent: var(--first-run); }
  .card.optional { --accent: var(--optional); } .card.safety { --accent: var(--safety); }
  .card header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .card h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 10px; letter-spacing: .1em; font-weight: 700; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 10px; padding: 4px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  li:first-child { border-top: 0; }
  kbd {
    font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    color: var(--key); background: var(--bg); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 7px; align-self: start; justify-self: start; white-space: nowrap;
  }
  li.hidden { display: none; }
  .card.hidden { display: none; }
  .card p { margin: 10px 0 4px; color: var(--muted); font-size: 12.5px; }
  body.filtering .card p { display: none; }
  footer { padding: 8px 22px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); display: flex; gap: 18px; }
  footer kbd { font-size: 10.5px; padding: 0 5px; }
</style>
</head>
<body>
<header class="top">
  <h1>Strix</h1>
  <nav role="tablist">{{TABS}}</nav>
  <div class="search"><input id="q" type="search" placeholder="Type to filter…  (Esc closes)" autofocus autocomplete="off"></div>
</header>
<main>{{PANELS}}</main>
<footer>
  <span><kbd>1</kbd>–<kbd>4</kbd> pages</span><span><kbd>/</kbd> filter</span><span><kbd>Esc</kbd> close</span>
  <span style="margin-left:auto">source: linux-setup · edition {{EDITION}}</span>
</footer>
<script>
  const tabs = [...document.querySelectorAll('.tab')];
  const panels = [...document.querySelectorAll('.panel')];
  const q = document.getElementById('q');
  let current = 0;
  try { current = Math.min(panels.length - 1, Number(localStorage.getItem('tab') || 0)); } catch (e) {}
  function show(i) {
    current = i;
    tabs.forEach((t, j) => t.classList.toggle('active', j === i));
    panels.forEach((p, j) => p.classList.toggle('active', j === i));
    try { localStorage.setItem('tab', String(i)); } catch (e) {}
  }
  tabs.forEach((t, i) => t.addEventListener('click', () => show(i)));
  show(current);
  function filter() {
    const needle = q.value.trim().toLowerCase();
    document.body.classList.toggle('filtering', needle.length > 0);
    panels.forEach(p => {
      let panelHits = 0;
      p.querySelectorAll('.card').forEach(c => {
        let hits = 0;
        c.querySelectorAll('li').forEach(li => {
          const hit = !needle || li.textContent.toLowerCase().includes(needle);
          li.classList.toggle('hidden', !hit); if (hit) hits++;
        });
        const titleHit = needle && c.querySelector('h2').textContent.toLowerCase().includes(needle);
        if (titleHit) { c.querySelectorAll('li').forEach(li => li.classList.remove('hidden')); hits = 1; }
        c.classList.toggle('hidden', needle && hits === 0);
        panelHits += hits;
      });
      p.classList.toggle('has-hits', panelHits > 0);
    });
  }
  q.addEventListener('input', filter);
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (q.value) { q.value = ''; filter(); } else { window.close(); } return; }
    if (document.activeElement === q) return;
    if (ev.key >= '1' && ev.key <= String(panels.length)) { show(Number(ev.key) - 1); }
    if (ev.key === '/') { ev.preventDefault(); q.focus(); }
  });
</script>
</body>
</html>
